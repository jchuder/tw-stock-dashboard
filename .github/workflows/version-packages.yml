name: Version Packages

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: version-packages-dev
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - name: Create repository automation token
        id: app-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ vars.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout dev
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v2.1.0
        with:
          runtime: node@24
          cache: true
          install: true

      - name: Detect pending changesets
        id: pending
        shell: bash
        run: |
          if find .changeset -maxdepth 1 -type f -name '*.md' ! -name 'README.md' -print -quit | grep -q .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Close stale version PR
        if: steps.pending.outputs.found != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash
        run: |
          pr_number="$(gh pr list --base dev --head release/versions --state open --json number --jq '.[0].number // empty')"
          if [ -n "$pr_number" ]; then
            gh pr close "$pr_number" --comment "`dev` 目前沒有待處理的 Changeset，因此自動關閉此版本更新 PR。"
          fi

      - name: Build release plan
        if: steps.pending.outputs.found == 'true'
        shell: bash
        run: pnpm changeset status --verbose | tee /tmp/changeset-status.txt

      - name: Version packages
        if: steps.pending.outputs.found == 'true'
        shell: bash
        run: |
          git switch -C release/versions
          pnpm version:packages
          pnpm install --lockfile-only

      - name: Configure automation Git identity
        if: steps.pending.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        shell: bash
        run: |
          bot_login="${APP_SLUG}[bot]"
          bot_id="$(gh api "/users/${bot_login}" --jq .id)"
          git config user.name "$bot_login"
          git config user.email "${bot_id}+${bot_login}@users.noreply.github.com"

      - name: Commit version changes
        if: steps.pending.outputs.found == 'true'
        shell: bash
        run: |
          git add --all
          git commit -m "chore(release): Version packages"
          git push --force-with-lease origin HEAD:release/versions

      - name: Create or update version PR
        if: steps.pending.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash
        run: |
          cat > /tmp/version-pr-body.md <<'EOF'
          ## 版本更新

          此 PR 是根據 `dev` 上所有待處理 Changesets 自動產生的滾動版本規劃。

          如果本次 release 還會繼續合併其他開發內容，請保持此 PR 開啟。
          每次 `dev` 出現新的待處理 Changesets 時，automation 都會從最新 `dev` 重建 `release/versions`，並更新此 PR。

          僅在明確準備並凍結下一次 release candidate 時，才將此 PR merge 回 `dev`。
          Merge 後確認 release candidate 無誤，再建立 `dev → main` Release PR。

          請勿在 `release/versions` branch 加入產品功能或其他非版本管理變更。

          ### 待發布版本規劃

          ```text
          EOF
          cat /tmp/changeset-status.txt >> /tmp/version-pr-body.md
          cat >> /tmp/version-pr-body.md <<'EOF'
          ```
          EOF

          pr_number="$(gh pr list --base dev --head release/versions --state open --json number --jq '.[0].number // empty')"
          if [ -n "$pr_number" ]; then
            gh pr edit "$pr_number" --title "chore(release): Version packages" --body-file /tmp/version-pr-body.md
          else
            gh pr create \
              --base dev \
              --head release/versions \
              --title "chore(release): Version packages" \
              --body-file /tmp/version-pr-body.md
          fi
