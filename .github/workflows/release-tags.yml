name: Release Tags

on:
  push:
    branches:
      - main
    paths:
      - 'apps/**/package.json'
      - 'packages/**/package.json'
  workflow_dispatch:
    inputs:
      base_sha:
        description: Commit before the release version changes
        required: true
        type: string

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v2.1.0
        with:
          runtime: node@24
          cache: true
          install: true

      - name: Find package version changes
        id: versions
        env:
          BEFORE_SHA: ${{ github.event.before }}
          RECOVERY_BASE_SHA: ${{ inputs.base_sha }}
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            base_sha="$RECOVERY_BASE_SHA"
          else
            base_sha="$BEFORE_SHA"
          fi

          if [ -z "$base_sha" ] || [ "$base_sha" = "0000000000000000000000000000000000000000" ]; then
            echo "A valid base SHA is required to determine package version changes." >&2
            exit 1
          fi

          if ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
            echo "Base SHA is not available in repository history: $base_sha" >&2
            exit 1
          fi

          node --input-type=module - "$base_sha" <<'NODE' > /tmp/version-tags.txt
          import { execFileSync } from 'node:child_process';
          import { readFileSync } from 'node:fs';

          const base = process.argv[2];
          const changed = execFileSync('git', ['diff', '--name-only', base, 'HEAD'], { encoding: 'utf8' })
            .trim()
            .split('\n')
            .filter((path) => /^(apps|packages)\/[^/]+\/package\.json$/.test(path));

          for (const path of changed) {
            const current = JSON.parse(readFileSync(path, 'utf8'));
            let previous;
            try {
              previous = JSON.parse(execFileSync('git', ['show', `${base}:${path}`], { encoding: 'utf8' }));
            } catch {
              continue;
            }

            if (previous.version !== current.version) {
              console.log(`${current.name}@${current.version}`);
            }
          }
          NODE

          if [ -s /tmp/version-tags.txt ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Version tags to publish:"
            cat /tmp/version-tags.txt
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No workspace package version changed."
          fi

      - name: Configure Git tag identity
        if: steps.versions.outputs.found == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create changed package tags
        if: steps.versions.outputs.found == 'true'
        shell: bash
        run: |
          while IFS= read -r tag; do
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              tagged_commit="$(git rev-list -n 1 "$tag")"
              if [ "$tagged_commit" != "$GITHUB_SHA" ]; then
                echo "Tag already exists on a different commit: $tag -> $tagged_commit" >&2
                exit 1
              fi
              echo "Tag already exists on this release commit: $tag"
              continue
            fi

            git tag "$tag" -m "$tag" "$GITHUB_SHA"
          done < /tmp/version-tags.txt

      - name: Push changed package tags
        if: steps.versions.outputs.found == 'true'
        shell: bash
        run: |
          while IFS= read -r tag; do
            git push origin "refs/tags/$tag"
          done < /tmp/version-tags.txt
